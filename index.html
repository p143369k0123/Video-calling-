<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConnect - High Quality P2P Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 10px 20px; 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .container { 
            max-width: 1000px; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .header p { color: #6b7280; font-size: 14px; margin-top: 4px; }

        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            border-radius: 20px; 
            padding: 15px 20px; 
            box-shadow: var(--shadow); 
            margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.8);
        }

        .controls-top { display: flex; gap: 12px; justify-content: center; align-items: center;}
        .input-group { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; }
        
        input { 
            padding: 12px 16px; 
            border: 2px solid transparent; 
            border-radius: 12px; 
            outline: none; 
            font-size: 15px; 
            width: 100%;
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease; 
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        button { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }

        .status { margin-top: 8px; font-weight: 500; color: #4b5563; text-align: center; font-size: 14px; }

        /* Video Area Flexible Setup */
        .video-container { 
            position: relative; 
            width: 100%; 
            flex: 1; 
            background: #111827; 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        
        #remoteVideo, #localVideo {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* Remote Video (Main Full Screen) */
        #remoteVideo { 
            width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 1; 
        }
        
        /* Local Video (Chhoti Screen - Positioned Bottom-Right inside Main Screen) */
        #localVideo { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 220px; 
            aspect-ratio: 16/9; 
            background: #1f2937; 
            border-radius: 16px; 
            object-fit: cover; 
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            z-index: 10; 
        }

        /* Swapped State (Tap karne par screen swap) */
        .video-container.swapped #localVideo {
            width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; border: none; z-index: 1;
        }
        .video-container.swapped #remoteVideo {
            width: 220px; height: auto; aspect-ratio: 16/9; bottom: 20px; left: 20px; 
            top: auto; right: auto; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Call Controls Bottom */
        .call-controls { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 15px; z-index: 20; 
            background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); 
            padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .icon-btn { 
            width: 48px; height: 48px; border-radius: 50%; padding: 0; font-size: 18px; 
            background: rgba(255,255,255,0.15); color: white; border: none;
        }
        .btn-danger { background: var(--danger) !important; color: white; }

        @media (max-width: 768px) { 
            #localVideo { width: 130px; bottom: 85px; right: 15px; }
            .video-container.swapped #remoteVideo { width: 130px; bottom: 85px; left: 15px; }
            .call-controls { bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-video" style="color: var(--primary);"></i> ProConnect HD</h1>
            <p>High-Quality P2P Video Call</p>
        </div>

        <div class="glass-panel">
            <div class="controls-top">
                <div class="input-group">
                    <input type="text" id="roomCodeInput" placeholder="Enter Same Room Code / Number (e.g. 1234)">
                    <button class="btn-primary" id="joinBtn" onclick="connectToRoom()"><i class="fa-solid fa-plug"></i> Join Call</button>
                </div>
            </div>
            <div class="status" id="statusText">Enter a room code and click Join Call to start.</div>
        </div>

        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <div class="call-controls" id="callControls" style="display: none;">
                <button class="icon-btn" id="toggleAudio" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" id="toggleVideo" onclick="toggleCam()"><i class="fa-solid fa-video"></i></button>
                <button class="icon-btn btn-danger" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const ringtone = new Audio('https://actions.google.com/sounds/v1/alarms/phone_ringing.ogg');
        ringtone.loop = true;

        const roomCodeInput = document.getElementById('roomCodeInput');
        const joinBtn = document.getElementById('joinBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const callControls = document.getElementById('callControls');
        const videoContainer = document.querySelector('.video-container');

        // Video screens swap function on click
        function toggleVideoSwap() {
            if (remoteVideo.srcObject) {
                videoContainer.classList.toggle('swapped');
            }
        }
        localVideo.addEventListener('click', toggleVideoSwap);
        remoteVideo.addEventListener('click', toggleVideoSwap);

        // Ultra High Quality Media Stream Setup (1080p / 60 FPS)
        async function getHighQualityStream() {
            if (localStream) return localStream;
            try {
                const constraints = {
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: {
                        width: { ideal: 1920, max: 3840 },
                        height: { ideal: 1080, max: 2160 },
                        frameRate: { ideal: 60, max: 60 }
                    }
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                return localStream;
            } catch (error) {
                console.error("Camera access error:", error);
                statusText.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Camera/Mic permission denied.';
                throw error;
            }
        }

        async function connectToRoom() {
            const roomCode = roomCodeInput.value.trim();
            if (!roomCode) {
                alert("Kripya koi room number ya code dalein!");
                return;
            }

            joinBtn.disabled = true;
            statusText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Initializing High Quality Camera...';

            try {
                await getHighQualityStream();
            } catch(e) {
                joinBtn.disabled = false;
                return;
            }

            // WebRTC STUN Server Config for fast & HD transmission
            const peerConfig = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            };

            const hostPeerId = "proconnect_room_" + roomCode;

            // Pehle Room Host ban-ne ki koshish karenge
            peer = new Peer(hostPeerId, peerConfig);

            peer.on('open', (id) => {
                statusText.innerHTML = '<i class="fa-solid fa-check-circle" style="color:var(--success);"></i> Room "' + roomCode + '" created! Waiting for partner to enter same room code...';
            });

            // Incoming call handle karna jab partner connect kare
            peer.on('call', (call) => {
                ringtone.play();
                setTimeout(() => {
                    ringtone.pause();
                    ringtone.currentTime = 0;
                    call.answer(localStream);
                    handleCallStatus(call);
                    statusText.innerHTML = '<i class="fa-solid fa-lock" style="color:var(--success);"></i> High Quality Call Connected!';
                }, 300);
            });

            // Agar ID pehle se taken hai (Matlab dusra user pehle se room bana chuka hai), toh hum auto-join karenge
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    
                    statusText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Room found! Connecting HD call...';
                    
                    const guestPeer = new Peer(peerConfig);
                    guestPeer.on('open', () => {
                        const call = guestPeer.call(hostPeerId, localStream);
                        handleCallStatus(call);
                        statusText.innerHTML = '<i class="fa-solid fa-lock" style="color:var(--success);"></i> High Quality Call Connected!';
                    });

                    guestPeer.on('error', (gErr) => {
                        alert("Connection error: " + gErr.type);
                        joinBtn.disabled = false;
                        statusText.innerText = "Connection failed. Try again.";
                    });

                    peer = guestPeer;
                } else {
                    alert("Error: " + err.type);
                    joinBtn.disabled = false;
                    statusText.innerText = "Error connecting. Try again.";
                }
            });
        }

        function handleCallStatus(call) {
            currentCall = call;
            callControls.style.display = 'flex';
            joinBtn.disabled = true;

            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
            });

            call.on('close', endCall);
            call.on('error', (err) => {
                alert("Call error: " + err);
                endCall();
            });
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (peer) peer.destroy();
            remoteVideo.srcObject = null;
            callControls.style.display = 'none';
            joinBtn.disabled = false;
            videoContainer.classList.remove('swapped');
            statusText.innerHTML = '<i class="fa-solid fa-info-circle"></i> Call ended. Enter room code to connect again.';
        }

        let audioEnabled = true;
        function toggleMute() {
            if (!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks()[0].enabled = audioEnabled;
            const btn = document.getElementById('toggleAudio');
            btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            btn.style.background = audioEnabled ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        let videoEnabled = true;
        function toggleCam() {
            if (!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks()[0].enabled = videoEnabled;
            const btn = document.getElementById('toggleVideo');
            btn.innerHTML = videoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            btn.style.background = videoEnabled ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }
    </script>
</body>
</html>
