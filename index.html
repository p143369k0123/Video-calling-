<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConnect - Advance P2P Video Call</title>
    <!-- PeerJS for P2P connection & FontAwesome for Icons -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { max-width: 1000px; width: 100%; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 28px; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .header p { color: #6b7280; font-size: 15px; margin-top: 5px; }

        /* Soft UI Glassmorphism Panel */
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: var(--shadow); 
            margin-bottom: 20px; 
            border: 1px solid rgba(255,255,255,0.8);
        }

        .controls-top { display: flex; gap: 15px; justify-content: space-between; flex-wrap: wrap; align-items: center;}
        
        .input-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 280px; }
        
        input { 
            padding: 14px 20px; 
            border: 2px solid transparent; 
            border-radius: 12px; 
            outline: none; 
            font-size: 16px; 
            width: 100%;
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease; 
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        button { 
            padding: 14px 24px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
        }
        button:active { transform: scale(0.96); }
        
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-secondary { background: #ffffff; color: var(--text); border: 1px solid #e5e7eb; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-secondary:hover { background: #f9fafb; }

        .id-box { 
            background: #ffffff; padding: 12px 18px; border-radius: 12px; 
            font-family: monospace; font-size: 16px; font-weight: bold; 
            color: var(--primary); border: 1px dashed #cbd5e1; user-select: all;
        }

        .status { margin-top: 15px; font-weight: 500; color: #4b5563; text-align: center; font-size: 14px; }

        /* Video Area */
        .video-container { 
            position: relative; width: 100%; aspect-ratio: 16/9; 
            background: #111827; border-radius: 24px; overflow: hidden; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
        }
        
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        
        #localVideo { 
            position: absolute; bottom: 20px; right: 20px; width: 220px; 
            aspect-ratio: 16/9; background: #374151; border-radius: 16px; 
            object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            z-index: 10; transition: transform 0.3s ease;
        }
        #localVideo:hover { transform: scale(1.03) translateY(-5px); }

        /* Call Controls Bottom */
        .call-controls { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 15px; z-index: 15; 
            background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); 
            padding: 12px 24px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .icon-btn { 
            width: 50px; height: 50px; border-radius: 50%; padding: 0; font-size: 20px; 
            background: rgba(255,255,255,0.15); color: white; border: none;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.25); }
        .btn-danger { background: var(--danger) !important; color: white; }
        .btn-danger:hover { background: #dc2626 !important; }

        @media (max-width: 768px) { 
            .controls-top { flex-direction: column; } 
            .input-group { width: 100%; }
            #localVideo { width: 120px; bottom: 100px; }
            .video-container { aspect-ratio: 3/4; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-video" style="color: var(--primary);"></i> ProConnect</h1>
            <p>High-Speed Peer-to-Peer Video Communication</p>
        </div>

        <div class="glass-panel">
            <div class="controls-top">
                <div class="input-group" style="flex: 0.8;">
                    <span style="font-weight: 500;">Your ID:</span>
                    <span class="id-box" id="myId">Connecting...</span>
                    <button class="btn-secondary" onclick="copyId()" title="Copy Your ID"><i class="fa-regular fa-copy"></i></button>
                </div>
                
                <div class="input-group">
                    <input type="text" id="peerId" placeholder="Paste friend's ID to connect...">
                    <button class="btn-success" id="callBtn" onclick="makeCall()"><i class="fa-solid fa-phone"></i> Call</button>
                </div>
            </div>
            <div class="status" id="statusText"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing secure server...</div>
        </div>

        <div class="video-container">
            <!-- Videos -->
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <!-- In-Call Controls -->
            <div class="call-controls" id="callControls" style="display: none;">
                <button class="icon-btn" id="toggleAudio" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" id="toggleVideo" onclick="toggleCam()"><i class="fa-solid fa-video"></i></button>
                <button class="icon-btn btn-danger" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Initialize PeerJS Connection
        const peer = new Peer({ debug: 2 });
        let localStream;
        let currentCall;

        const myIdEl = document.getElementById('myId');
        const peerIdInput = document.getElementById('peerId');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const callControls = document.getElementById('callControls');
        const callBtn = document.getElementById('callBtn');

        // 1. Generate & Show My ID
        peer.on('open', (id) => {
            myIdEl.innerText = id;
            statusText.innerHTML = '<i class="fa-solid fa-check-circle" style="color:var(--success);"></i> System ready. Share your ID with a friend!';
            startMyVideo();
        });

        // 2. Start Local Camera/Mic
        async function startMyVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
            } catch (error) {
                statusText.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Camera/Mic access denied. Please allow permissions.';
                console.error("Media Error:", error);
            }
        }

        // 3. Handle Incoming Call
        peer.on('call', (call) => {
            const accept = confirm("Incoming call! Do you want to accept?");
            if (accept) {
                call.answer(localStream); // Answer with our stream
                handleCallStatus(call);
                statusText.innerHTML = '<i class="fa-solid fa-lock"></i> Call Connected Securely.';
            } else {
                call.close();
            }
        });

        // 4. Make Outgoing Call
        function makeCall() {
            const remoteId = peerIdInput.value.trim();
            if (!remoteId) {
                alert("Please enter a valid Peer ID first.");
                return;
            }
            statusText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Ringing...';
            const call = peer.call(remoteId, localStream);
            handleCallStatus(call);
        }

        // 5. Manage Call Stream & UI
        function handleCallStatus(call) {
            currentCall = call;
            callControls.style.display = 'flex';
            callBtn.disabled = true;

            // Show Remote Video
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
            });

            // Handle Call End
            call.on('close', endCall);
            
            // Handle Errors
            call.on('error', (err) => {
                alert("Connection failed: " + err);
                endCall();
            });
        }

        // 6. In-Call Actions
        function endCall() {
            if (currentCall) currentCall.close();
            remoteVideo.srcObject = null;
            callControls.style.display = 'none';
            callBtn.disabled = false;
            statusText.innerHTML = '<i class="fa-solid fa-info-circle"></i> Call ended. Ready for a new connection.';
        }

        let audioEnabled = true;
        function toggleMute() {
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks()[0].enabled = audioEnabled;
            const btn = document.getElementById('toggleAudio');
            btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            btn.style.background = audioEnabled ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        let videoEnabled = true;
        function toggleCam() {
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks()[0].enabled = videoEnabled;
            const btn = document.getElementById('toggleVideo');
            btn.innerHTML = videoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            btn.style.background = videoEnabled ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        function copyId() {
            navigator.clipboard.writeText(myIdEl.innerText);
            const originalText = statusText.innerHTML;
            statusText.innerHTML = '<i class="fa-solid fa-copy" style="color:var(--primary);"></i> ID Copied to clipboard!';
            setTimeout(() => { statusText.innerHTML = originalText; }, 2500);
        }
    </script>
</body>
</html>
