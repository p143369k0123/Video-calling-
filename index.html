<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProConnect - Ultra Low Latency P2P Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            min-height: 100dvh; 
            padding: 12px;
            overflow: hidden; 
        }

        .container { 
            width: 100%; 
            max-width: 1200px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            flex: 1;
        }
        
        .header { 
            text-align: center; 
            padding: 4px 0;
        }
        .header h1 { 
            font-size: 1.4rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            font-weight: 700;
        }
        .header p { 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            margin-top: 2px; 
        }

        .glass-panel { 
            background: var(--panel-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; 
            padding: 12px 16px; 
            box-shadow: var(--shadow); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-top { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            align-items: center;
        }
        .input-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            width: 100%; 
            max-width: 480px; 
        }
        
        input { 
            padding: 10px 14px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 10px; 
            outline: none; 
            font-size: 14px; 
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            transition: all 0.2s ease; 
        }
        input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); 
        }

        button { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 6px; 
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        
        .btn-primary { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); 
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .status { 
            margin-top: 6px; 
            font-weight: 500; 
            color: var(--text-muted); 
            text-align: center; 
            font-size: 13px; 
        }

        /* Responsive Video Container Setup */
        .video-container { 
            position: relative; 
            width: 100%; 
            flex: 1; 
            background: #000000; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #remoteVideo, #localVideo {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* Remote Video (Main View) */
        #remoteVideo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* Local Video PIP Overlay */
        #localVideo { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 180px; 
            aspect-ratio: 16/9; 
            background: #1e293b; 
            border-radius: 12px; 
            object-fit: cover; 
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            z-index: 10; 
        }

        /* Video Swap Feature */
        .video-container.swapped #localVideo {
            width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; border: none; z-index: 1;
        }
        .video-container.swapped #remoteVideo {
            width: 180px; height: auto; aspect-ratio: 16/9; bottom: 20px; left: 20px; 
            top: auto; right: auto; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10; box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* Floating Call Controls */
        .call-controls { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px; 
            z-index: 20; 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px; 
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            padding: 0; 
            font-size: 16px; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border: none;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-danger { background: var(--danger) !important; color: white; }

        /* Tablet Responsive Adjustments */
        @media (max-width: 1024px) {
            #localVideo { width: 150px; bottom: 18px; right: 18px; }
            .video-container.swapped #remoteVideo { width: 150px; bottom: 18px; left: 18px; }
        }

        /* Mobile Screen Responsive Adjustments */
        @media (max-width: 600px) { 
            body { padding: 8px; }
            .header h1 { font-size: 1.2rem; }
            .header p { font-size: 0.75rem; }
            .glass-panel { padding: 10px; border-radius: 12px; }
            input { padding: 8px 12px; font-size: 13px; }
            button { padding: 8px 14px; font-size: 13px; }
            
            /* Reposition local PIP video so controls don't overlap on mobile */
            #localVideo { 
                width: 110px; 
                bottom: 75px; 
                right: 12px; 
                border-radius: 10px;
            }
            .video-container.swapped #remoteVideo { 
                width: 110px; 
                bottom: 75px; 
                left: 12px; 
                border-radius: 10px;
            }
            .call-controls { 
                bottom: 12px; 
                padding: 6px 12px; 
                gap: 10px; 
            }
            .icon-btn { width: 40px; height: 40px; font-size: 14px; }
        }

        /* Mobile Landscape Orientation */
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 4px; }
            .header { display: none; }
            .glass-panel { padding: 6px 10px; }
            #localVideo { width: 90px; bottom: 60px; right: 10px; }
            .call-controls { bottom: 8px; padding: 4px 10px; }
            .icon-btn { width: 36px; height: 36px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-bolt" style="color: var(--primary);"></i> ProConnect HD</h1>
            <p>Low Latency P2P Video Call</p>
        </div>

        <div class="glass-panel">
            <div class="controls-top">
                <div class="input-group">
                    <input type="text" id="roomCodeInput" placeholder="Enter Room Number (e.g. 1234)">
                    <button class="btn-primary" id="joinBtn" onclick="connectToRoom()"><i class="fa-solid fa-plug"></i> Join Call</button>
                </div>
            </div>
            <div class="status" id="statusText">Enter a room code and click Join Call to start.</div>
        </div>

        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <div class="call-controls" id="callControls" style="display: none;">
                <button class="icon-btn" id="toggleAudio" onclick="toggleMute()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" id="toggleVideo" onclick="toggleCam()"><i class="fa-solid fa-video"></i></button>
                <button class="icon-btn btn-danger" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const ringtone = new Audio('https://actions.google.com/sounds/v1/alarms/phone_ringing.ogg');
        ringtone.loop = true;

        const roomCodeInput = document.getElementById('roomCodeInput');
        const joinBtn = document.getElementById('joinBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const callControls = document.getElementById('callControls');
        const videoContainer = document.querySelector('.video-container');

        // Video screens swap on tap/click
        function toggleVideoSwap() {
            if (remoteVideo.srcObject) {
                videoContainer.classList.toggle('swapped');
            }
        }
        localVideo.addEventListener('click', toggleVideoSwap);
        remoteVideo.addEventListener('click', toggleVideoSwap);

        // 1. Optimized Media Constraints (720p @ 30fps + Mono Audio + Audio Processing)
        async function getOptimizedStream() {
            if (localStream) return localStream;
            try {
                const constraints = {
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1, // Mono saves processing overhead
                        sampleRate: 48000
                    },
                    video: {
                        width: { ideal: 1280, max: 1280 },
                        height: { ideal: 720, max: 720 },
                        frameRate: { ideal: 30, max: 30 } // Max 30 FPS prevents buffer lag
                    }
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                return localStream;
            } catch (error) {
                console.error("Camera access error:", error);
                statusText.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Camera/Mic permission denied.';
                throw error;
            }
        }

        // 2. TURN Server Config & Trickle ICE setup
        const peerConfig = {
            debug: 1,
            config: {
                iceTransportPolicy: 'all',
                iceCandidatePoolSize: 10, // Pre-gathers ICE candidates for zero delay
                iceServers: [
                    { urls: [ "stun:ss-turn2.xirsys.com" ] },
                    {
                        username: "pfppXzJQnDnWkGf_ABueBEhd_2bd3_SuXrYINvk8DwO_wQlRSVfPwic4b0rNMqdXAAAAAGq5IxdwMTQzMzY5aw==",
                        credential: "c05a6244-ba7c-11f1-bb10-0242ac140004",
                        urls: [
                            "turn:ss-turn2.xirsys.com:80?transport=udp",
                            "turn:ss-turn2.xirsys.com:3478?transport=udp",
                            "turn:ss-turn2.xirsys.com:80?transport=tcp",
                            "turn:ss-turn2.xirsys.com:3478?transport=tcp",
                            "turns:ss-turn2.xirsys.com:443?transport=tcp",
                            "turns:ss-turn2.xirsys.com:5349?transport=tcp"
                        ]
                    }
                ]
            }
        };

        // 3. Bandwidth Bitrate Cap Logic (Limits Video Stream to ~600kbps)
        function applyBitrateCap(call) {
            if (!call || !call.peerConnection) return;
            
            const setSendersBitrate = () => {
                const senders = call.peerConnection.getSenders();
                senders.forEach(sender => {
                    if (sender.track && sender.track.kind === 'video') {
                        const parameters = sender.getParameters();
                        if (!parameters.encodings || parameters.encodings.length === 0) {
                            parameters.encodings = [{}];
                        }
                        parameters.encodings[0].maxBitrate = 600000; // 600 kbps max
                        parameters.encodings[0].maxFramerate = 30;
                        sender.setParameters(parameters).catch(err => console.warn("Bitrate set warn:", err));
                    }
                });
            };

            // Set immediately and also listen for connection state
            setSendersBitrate();
            call.peerConnection.addEventListener('iceconnectionstatechange', () => {
                if (call.peerConnection.iceConnectionState === 'connected') {
                    setSendersBitrate();
                }
            });
        }

        async function connectToRoom() {
            const roomCode = roomCodeInput.value.trim();
            if (!roomCode) {
                alert("Please enter a room code!");
                return;
            }

            joinBtn.disabled = true;
            statusText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Initializing Camera...';

            try {
                await getOptimizedStream();
            } catch(e) {
                joinBtn.disabled = false;
                return;
            }

            const hostPeerId = "proconnect_room_" + roomCode;

            // First attempt to become the Host
            peer = new Peer(hostPeerId, peerConfig);

            peer.on('open', (id) => {
                statusText.innerHTML = '<i class="fa-solid fa-check-circle" style="color:var(--success);"></i> Room "' + roomCode + '" created! Waiting for peer...';
            });

            // Handle incoming call
            peer.on('call', (call) => {
                ringtone.play().catch(e => console.log(e));
                setTimeout(() => {
                    ringtone.pause();
                    ringtone.currentTime = 0;
                    call.answer(localStream);
                    handleCallStatus(call);
                    statusText.innerHTML = '<i class="fa-solid fa-lock" style="color:var(--success);"></i> Connected (Low Latency)';
                }, 200);
            });

            // If ID is already taken, connect as Guest
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    
                    statusText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Joining Room...';
                    
                    const guestPeer = new Peer(peerConfig);
                    guestPeer.on('open', () => {
                        const call = guestPeer.call(hostPeerId, localStream);
                        handleCallStatus(call);
                        statusText.innerHTML = '<i class="fa-solid fa-lock" style="color:var(--success);"></i> Connected (Low Latency)';
                    });

                    guestPeer.on('error', (gErr) => {
                        alert("Connection error: " + gErr.type);
                        joinBtn.disabled = false;
                        statusText.innerText = "Connection failed. Try again.";
                    });

                    peer = guestPeer;
                } else {
                    alert("Error: " + err.type);
                    joinBtn.disabled = false;
                    statusText.innerText = "Error connecting. Try again.";
                }
            });
        }

        function handleCallStatus(call) {
            currentCall = call;
            callControls.style.display = 'flex';
            joinBtn.disabled = true;

            applyBitrateCap(call);

            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
            });

            call.on('close', endCall);
            call.on('error', (err) => {
                console.error("Call error:", err);
                endCall();
            });
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (peer) peer.destroy();
            
            ringtone.pause();
            ringtone.currentTime = 0;
            
            remoteVideo.srcObject = null;
            callControls.style.display = 'none';
            joinBtn.disabled = false;
            videoContainer.classList.remove('swapped');
            statusText.innerHTML = '<i class="fa-solid fa-info-circle"></i> Call ended. Enter room code to reconnect.';
        }

        let audioEnabled = true;
        function toggleMute() {
            if (!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks()[0].enabled = audioEnabled;
            const btn = document.getElementById('toggleAudio');
            btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            btn.style.background = audioEnabled ? 'rgba(255,255,255,0.1)' : 'rgba(239, 68, 68, 0.8)';
        }

        let videoEnabled = true;
        function toggleCam() {
            if (!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks()[0].enabled = videoEnabled;
            const btn = document.getElementById('toggleVideo');
            btn.innerHTML = videoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            btn.style.background = videoEnabled ? 'rgba(255,255,255,0.1)' : 'rgba(239, 68, 68, 0.8)';
        }
    </script>
</body>
</html>
